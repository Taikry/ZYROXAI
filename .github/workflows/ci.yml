name: ZYROX AI CI/CD Pipeline

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Test Suite (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest httpx

      - name: Run Core & V6.2.2 Unit & Regression Tests
        env:
          DATABASE_URL: "sqlite:///./test_ci.db"
          PUBLIC_APP_URL: "https://zyroxai.onrender.com"
          AUTO_START_MONITORING: "false"
          ENVIRONMENT: "testing"
        run: |
          pytest tests/test_v61_quote_safety.py tests/test_v61_auth_flows.py tests/test_v61_scheduler_and_scoring.py tests/test_xauusd_telegram_engine.py tests/test_v622_risk_reward_gate.py -v

  frontend-build:
    name: Frontend Typecheck & Build (Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: TypeScript typecheck and Vite build
        run: npm run build

  deploy-render:
    name: Auto Deploy to Render
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook (if secret configured)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render automated deployment..."
            curl -f -s -S -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Render deploy hook triggered successfully."
          else
            echo "RENDER_DEPLOY_HOOK_URL secret is not set. Render will auto-deploy via GitHub Git sync."
          fi
